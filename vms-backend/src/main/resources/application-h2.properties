# In-memory database for running and testing without MySQL.
# Use with: --spring.profiles.active=h2   (data is lost on restart)
spring.datasource.url=jdbc:h2:mem:stark_vms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Local/test-only signing key (in-memory database profile). Never use the h2 profile in production.
app.jwt.secret=h2-profile-local-test-key-not-for-production-use
