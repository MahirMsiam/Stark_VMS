spring.application.name=vms-backend
server.port=9001

# ---- Database (MySQL) ----
# Credentials come from environment variables or a local .env file (git-ignored).
# Nothing secret lives in this file. See .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stark_vms}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA ----
# The schema is written explicitly (migrations), never guessed by Hibernate:
# validate only checks that entities match existing tables, it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside the service layer, not during JSON rendering.
spring.jpa.open-in-view=false

# ---- Health check: GET /actuator/health ----
# Shows UP/DOWN per component (incl. "db") without exposing connection details.
management.endpoint.health.show-components=always

# ---- CORS: which web origins may call /api/** from a browser ----
# Comma-separated; [*] = any port. In production set CORS_ALLOWED_ORIGINS to the deployed Flutter URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# ---- Authentication ----
# Signing key for access tokens: at least 32 random bytes. Set in .env / environment, never in code.
app.jwt.secret=${JWT_SECRET}
# How long a login lasts (e.g. 8h, 30m).
app.jwt.ttl=${JWT_TTL:8h}
# First admin account, created at startup if missing. Password only from .env / environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
